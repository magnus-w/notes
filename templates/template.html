<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{title}}</title>
<style>
  :root {
    --bg:     #fafaf7;
    --paper:  #ffffff;
    --ink:    #1a1a1a;
    --ink-2:  #333333;
    --ink-3:  #555555;
    --ink-4:  #888888;
    --rule:   #e8e6df;
    --cream:  #f7f3e8;
    --accent: #8b103d;
    --pop:    #ffc74e;
    --sans:   -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --serif:  Georgia, 'Times New Roman', serif;
    --mono:   'JetBrains Mono', 'Fira Code', ui-monospace, 'Courier New', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    background: var(--bg);
    color: var(--ink);
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }

  body {
    font-family: var(--sans);
    line-height: 1.6;
  }

  /* ── Page shell ── */
  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 4rem 2rem 6rem;
  }

  /* ── Document header ── */
  .doc-header {
    margin-bottom: 3rem;
    padding-bottom: 2.5rem;
    border-bottom: 1px solid var(--rule);
  }

  .doc-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 2rem;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-4);
  }

  .doc-title {
    font-family: var(--serif);
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: normal;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 1rem;
  }

  .doc-subtitle {
    font-size: 1.1rem;
    line-height: 1.5;
    color: var(--ink-3);
    max-width: 560px;
  }

  /* ── Body content — all markdown targets ── */
  .doc-body { color: var(--ink-2); }

  .doc-body > * + * { margin-top: 1.25rem; }

  /* Headings */
  .doc-body h1,
  .doc-body h2,
  .doc-body h3,
  .doc-body h4,
  .doc-body h5,
  .doc-body h6 {
    font-family: var(--serif);
    font-weight: normal;
    color: var(--ink);
    letter-spacing: -0.015em;
    line-height: 1.2;
  }

  .doc-body h1 { font-size: 1.9rem; margin-top: 3rem; margin-bottom: 0.75rem; }
  .doc-body h2 {
    font-size: 1.4rem;
    margin-top: 2.5rem;
    margin-bottom: 0.5rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--rule);
  }
  .doc-body h3 { font-size: 1.1rem; font-family: var(--sans); font-weight: 700; margin-top: 2rem; margin-bottom: 0.4rem; }
  .doc-body h4 { font-size: 0.9rem; font-family: var(--sans); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); margin-top: 1.75rem; margin-bottom: 0.3rem; }
  .doc-body h5,
  .doc-body h6 { font-size: 0.85rem; font-family: var(--sans); font-weight: 600; color: var(--ink-3); margin-top: 1.5rem; }

  /* Paragraph */
  .doc-body p { font-size: 1rem; line-height: 1.75; }

  /* Links */
  .doc-body a { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
  .doc-body a:hover { border-color: var(--accent); }

  /* Strong / em */
  .doc-body strong { font-weight: 700; color: var(--ink); }
  .doc-body em { font-style: italic; }

  /* Lists */
  .doc-body ul,
  .doc-body ol { padding-left: 1.5rem; }
  .doc-body li { font-size: 1rem; line-height: 1.7; margin-bottom: 0.3rem; }
  .doc-body li > ul,
  .doc-body li > ol { margin-top: 0.3rem; }

  /* Blockquote */
  .doc-body blockquote {
    border-left: 3px solid var(--accent);
    padding: 0.75rem 1.25rem;
    margin-left: 0;
    background: var(--cream);
    border-radius: 0 2px 2px 0;
  }
  .doc-body blockquote p { color: var(--ink-3); font-style: italic; }
  .doc-body blockquote p + p { margin-top: 0.5rem; }

  /* Horizontal rule */
  .doc-body hr {
    border: none;
    border-top: 1px solid var(--rule);
    margin: 2.5rem 0;
  }

  /* Inline code */
  .doc-body code {
    font-family: var(--mono);
    font-size: 0.85em;
    background: var(--cream);
    color: var(--accent);
    padding: 0.1em 0.35em;
    border-radius: 3px;
  }

  /* Code block */
  .doc-body pre {
    background: #1a1a18;
    color: #e8e6df;
    padding: 1.25rem 1.5rem;
    border-radius: 4px;
    overflow-x: auto;
    line-height: 1.55;
  }
  .doc-body pre code {
    font-family: var(--mono);
    font-size: 0.85rem;
    background: none;
    color: inherit;
    padding: 0;
  }

  /* Table */
  .doc-body table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }
  .doc-body th {
    text-align: left;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-4);
    padding: 0.5rem 0.75rem;
    border-bottom: 2px solid var(--rule);
  }
  .doc-body td {
    padding: 0.6rem 0.75rem;
    border-bottom: 1px solid var(--rule);
    vertical-align: top;
    line-height: 1.5;
  }
  .doc-body tr:last-child td { border-bottom: none; }
  .doc-body tr:hover td { background: var(--cream); }

  /* Images */
  .doc-body img {
    max-width: 100%;
    height: auto;
    border-radius: 2px;
    display: block;
  }

  /* ── Value blocks (fenced divs: ::: value) ── */
  .doc-body .values {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 1px;
    background: var(--rule);
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    margin-top: 1.5rem;
  }

  .doc-body .value {
    background: var(--bg);
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: background .2s;
  }
  .doc-body .value:hover { background: var(--cream); }

  /* First <p><strong>01</strong></p> becomes the big number */
  .doc-body .value > p:first-child {
    margin: 0;
    line-height: 1;
  }
  .doc-body .value > p:first-child > strong {
    font-size: 4rem;
    font-weight: 500;
    color: var(--pop);
    letter-spacing: -0.04em;
    line-height: 0.9;
    font-variant-numeric: lining-nums;
  }

  .doc-body .value h3 {
    font-family: var(--sans);
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink);
    margin: 0;
  }

  .doc-body .value p:not(:first-child) {
    font-size: 0.875rem;
    color: var(--ink-3);
    line-height: 1.5;
    margin: 0;
  }

  /* ── Print ── */
  @media print {
    @page { size: A4; margin: 18mm 20mm; }

    html { background: #fff; font-size: 10.5pt; }
    .page { max-width: 100%; padding: 0; }

    .doc-header { margin-bottom: 12mm; padding-bottom: 8mm; }
    .doc-title { font-size: 22pt; }
    .doc-subtitle { font-size: 10pt; }
    .doc-meta { font-size: 7pt; margin-bottom: 8mm; }

    .doc-body p,
    .doc-body li { font-size: 10pt; line-height: 1.6; }
    .doc-body h1 { font-size: 16pt; }
    .doc-body h2 { font-size: 13pt; }
    .doc-body h3 { font-size: 11pt; }

    /* Never break inside these elements — push to next page instead */
    .doc-body p,
    .doc-body li,
    .doc-body blockquote,
    .doc-body pre,
    .doc-body table,
    .doc-body .value {
      break-inside: avoid;
      page-break-inside: avoid;
    }

    /* Keep headings with the content that follows */
    .doc-body h1,
    .doc-body h2,
    .doc-body h3,
    .doc-body h4 {
      break-after: avoid;
      page-break-after: avoid;
    }

    /* Avoid orphaned/widowed lines in paragraphs */
    .doc-body p { orphans: 3; widows: 3; }

    .doc-body pre { background: #f5f5f2 !important; color: #111 !important; border: 1px solid #ddd; font-size: 8pt; }
    .doc-body pre code { color: inherit; }
    .doc-body a { border-bottom: none; }
    .doc-body a::after { content: " (" attr(href) ")"; font-size: 0.8em; color: #888; }
    .doc-body a[href^="#"]::after { content: none; }

    /* Value blocks in print */
    .doc-body .values { background: transparent; border-color: #ddd; gap: 3mm; }
    .doc-body .value { background: #f7f3e8 !important; padding: 5mm 6mm; break-inside: avoid; page-break-inside: avoid; }
    .doc-body .value > p:first-child > strong { font-size: 22pt; }
    .doc-body .value h3 { font-size: 9pt; }
    .doc-body .value p:not(:first-child) { font-size: 9pt; }

    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  /* ── Mobile ── */
  @media (max-width: 600px) {
    .page { padding: 2.5rem 1.25rem 4rem; }
    .doc-meta { flex-direction: column; gap: 0.25rem; }
    .doc-title { font-size: 1.75rem; }
  }
</style>
</head>
<body>
<div class="page">

  <header class="doc-header">
    <div class="doc-meta">
      <span class="doc-from">{{from}}</span>
      <span class="doc-date">{{date}}</span>
    </div>
    <h1 class="doc-title">{{title}}</h1>
    <p class="doc-subtitle">{{subtitle}}</p>
  </header>

  <main class="doc-body">

{{content}}

  </main>

</div>
</body>
</html>
